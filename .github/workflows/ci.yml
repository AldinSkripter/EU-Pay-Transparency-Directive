name: Verify Equitensa
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: equitensa_test
          POSTGRES_USER: equitensa_test
          POSTGRES_PASSWORD: local_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U equitensa_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_TEST_URL: postgresql://equitensa_test:local_ci_test_only@127.0.0.1:5432/equitensa_test
      PDF_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
      - run: npm test
      - run: npm run build
